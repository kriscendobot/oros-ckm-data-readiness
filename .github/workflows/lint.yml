name: Static checks

on:
  push:
    branches: [ckm-poc-build]
  pull_request:

jobs:
  typecheck:
    name: TypeScript (erasable syntax only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run typecheck` is `tsc`, and tsconfig.json sets
      # "erasableSyntaxOnly": true, so this fails on any TypeScript-only
      # runtime syntax (enums, namespaces with runtime code, parameter
      # properties, import-equals). See CONTRIBUTING.md.
      - run: npm run typecheck
